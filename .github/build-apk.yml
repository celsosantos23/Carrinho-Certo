name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Cria a parte Android do projeto (o repositório guarda só o código do app).
      - name: Criar estrutura Android
        run: |
          mkdir -p "$RUNNER_TEMP/bak"
          cp -r lib "$RUNNER_TEMP/bak/lib"
          cp pubspec.yaml "$RUNNER_TEMP/bak/pubspec.yaml"
          flutter create --platforms=android --org br.com.carrinhocerto --project-name carrinho_certo .
          rm -rf lib
          cp -r "$RUNNER_TEMP/bak/lib" lib
          cp "$RUNNER_TEMP/bak/pubspec.yaml" pubspec.yaml
          rm -rf test

      - name: Nome do app no celular
        run: sed -i 's/android:label="[^"]*"/android:label="Carrinho Certo"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: carrinho-certo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
